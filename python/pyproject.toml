[project]
name = "pay-dirt"
version = "0.1.0"
description = "Monty Hall with the part the textbook leaves out: who opened the door. A Gymnasium env and continuous eval."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pay_dirt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
